<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>AirMouse | 远程控制中心</title>
    <link rel="icon" type="image/png" href="/static/app-icon.png">
    <link rel="apple-touch-icon" href="/static/app-icon.png">
    <style>
        * {
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #0a0a0f;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            min-height: 100dvh;
            overflow-x: hidden;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            padding-bottom: 100px;
        }

        .header {
            text-align: center;
            padding: 30px 0 40px;
        }

        .logo {
            width: 72px;
            height: 72px;
            margin: 0 auto 16px;
            border-radius: 18px;
            background: url('/static/app-icon.png') center / cover no-repeat;
            box-shadow: 0 10px 28px rgba(120, 60, 200, 0.35);
        }

        .header h1 {
            margin: 0;
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #fff, #aaa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header p {
            margin: 8px 0 0;
            color: #666;
            font-size: 14px;
        }

        .section-title {
            font-size: 13px;
            font-weight: 600;
            color: #555;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin: 30px 0 16px;
            padding-left: 4px;
        }

        .card-grid {
            display: grid;
            gap: 12px;
        }

        .card {
            background: linear-gradient(145deg, #16161d, #1a1a24);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .card:active {
            transform: scale(0.98);
            background: linear-gradient(145deg, #1a1a24, #222230);
        }

        .card-icon {
            font-size: 32px;
            margin-right: 16px;
            width: 56px;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 14px;
        }

        .card-content {
            flex: 1;
        }

        .card-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .card-desc {
            font-size: 13px;
            color: #666;
        }

        .card.large .card-icon {
            width: 64px;
            height: 64px;
            font-size: 36px;
            margin-right: 20px;
            border-radius: 18px;
        }

        .card.large .card-title {
            font-size: 18px;
            margin-bottom: 6px;
        }

        .card.large .card-desc {
            font-size: 14px;
        }

        .status-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            margin-top: 30px;
            font-size: 13px;
            color: #555;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: #34C759;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .footer {
            text-align: center;
            padding: 30px 0;
            color: #333;
            font-size: 12px;
        }

        .qr-entry {
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 20;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 14px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 999px;
            background: rgba(22, 22, 29, 0.92);
            color: #fff;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            backdrop-filter: blur(8px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
            transition: background 0.2s ease, transform 0.2s ease;
        }

        .qr-entry:active {
            transform: scale(0.97);
            background: rgba(34, 34, 48, 0.95);
        }

        .qr-entry { cursor: pointer; font-family: inherit; }
        .connection-dialog {
            width: min(940px, calc(100% - 24px));
            height: min(850px, 90vh);
            height: min(850px, 90dvh);
            max-width: none;
            max-height: none;
            padding: 0;
            border: 1px solid #30382f;
            border-radius: 20px;
            background: #0b0d0c;
            color: #fff;
            box-shadow: 0 24px 90px #0009;
        }
        .connection-dialog[open] { display: flex; flex-direction: column; }
        .connection-dialog::backdrop { background: #000b; }
        .connection-dialog-head { display: flex; align-items: center; gap: 16px; padding: 16px 20px; }
        .connection-dialog-head h2 { font-size: 18px; margin: 0; flex: 1; }
        .connection-dialog-head a { color: #59e391; font-size: 12px; }
        .connection-dialog-head button {
            min-height: 44px; padding: 0 14px; border: 1px solid #3a423c;
            border-radius: 10px; color: #fff; background: #1b211e; cursor: pointer;
        }
        .connection-dialog iframe { flex: 1; min-height: 0; width: 100%; border: 0; }
        @media (max-width: 480px) {
            .connection-dialog-head { gap: 10px; padding: 12px; }
            .connection-dialog-head h2 { font-size: 16px; }
        }

        .qr-entry-icon {
            width: 18px;
            height: 18px;
            border: 1.5px solid #59e391;
            border-radius: 4px;
            position: relative;
            flex-shrink: 0;
        }

        .qr-entry-icon::before,
        .qr-entry-icon::after {
            content: "";
            position: absolute;
            background: #59e391;
        }

        .qr-entry-icon::before {
            width: 5px;
            height: 5px;
            top: 2px;
            left: 2px;
        }

        .qr-entry-icon::after {
            width: 5px;
            height: 5px;
            right: 2px;
            bottom: 2px;
        }
    </style>
</head>
<body onclick="if (typeof initAudio === 'function') initAudio()">
    <button type="button" class="qr-entry" id="connection-open" aria-haspopup="dialog" aria-controls="connection-dialog">
        <span class="qr-entry-icon" aria-hidden="true"></span>
        <span>扫码连接</span>
    </button>
    <dialog class="connection-dialog" id="connection-dialog" aria-labelledby="connection-title">
        <div class="connection-dialog-head">
            <h2 id="connection-title">手机扫码连接</h2>
            <a href="/connect" target="_blank" rel="noopener">单独打开</a>
            <button type="button" id="connection-close" autofocus>关闭</button>
        </div>
        <iframe id="connection-frame" title="电脑局域网连接二维码"></iframe>
    </dialog>
    <div class="container">
        <div class="header">
            <div class="logo" role="img" aria-label="AirMouse"></div>
            <h1>AirMouse</h1>
            <p>远程控制中心</p>
        </div>

        <div class="section-title">主要功能</div>
        <div class="card-grid">
            <div class="card large" onclick="v(); window.location.href='/touchpad'">
                <div class="card-icon">🖱️</div>
                <div class="card-content">
                    <div class="card-title">触摸板控制</div>
                    <div class="card-desc">体感情境 / 体感飞行 / 灵敏调节</div>
                </div>
            </div>

            <div class="card" onclick="v(); window.location.href='/k'">
                <div class="card-icon">⌨️</div>
                <div class="card-content">
                    <div class="card-title">键盘</div>
                    <div class="card-desc">全键盘输入</div>
                </div>
            </div>

            <div class="card" onclick="v(); window.location.href='/v'">
                <div class="card-icon">🎤</div>
                <div class="card-content">
                    <div class="card-title">语音输入</div>
                    <div class="card-desc">实时转文字</div>
                </div>
            </div>
        </div>

        <div class="section-title">快捷工具</div>
        <div class="card-grid">
            <div class="card" onclick="v(); window.location.href='/b'">
                <div class="card-icon">⚡</div>
                <div class="card-content">
                    <div class="card-title">Macro Deck</div>
                    <div class="card-desc">快捷按键面板</div>
                </div>
            </div>

            <div class="card" onclick="v(); window.location.href='/controller'">
                <div class="card-icon">🎮</div>
                <div class="card-content">
                    <div class="card-title">手柄映射</div>
                    <div class="card-desc">游戏手柄控制</div>
                </div>
            </div>

            <div class="card" onclick="v(); window.location.href='/settings'">
                <div class="card-icon">⚙️</div>
                <div class="card-content">
                    <div class="card-title">macOS 设置</div>
                    <div class="card-desc">权限检测 / 手势说明</div>
                </div>
            </div>
        </div>

        <div class="status-bar">
            <div class="status-dot"></div>
            <span>服务器已连接</span>
        </div>

        <div class="footer">
            AirMouse Remote v2.0
        </div>
    </div>

    <script>
        // 扫码弹窗独立于 Socket.IO 初始化；局域网断外网时也能打开。
        (() => {
            const dialog = document.getElementById('connection-dialog');
            const frame = document.getElementById('connection-frame');
            document.getElementById('connection-open').onclick = () => {
                if (typeof dialog.showModal !== 'function') {
                    window.location.href = '/connect';
                    return;
                }
                // 每次重新读取网卡地址，支持启动后从有线网络切到 Wi-Fi。
                frame.src = '/connect?embed=1';
                dialog.showModal();
            };
            document.getElementById('connection-close').onclick = () => dialog.close();
            frame.onload = () => {
                // iframe 内的键盘事件不会冒泡到主页，单独转交 Escape 关闭操作。
                frame.contentDocument?.addEventListener('keydown', event => {
                    if (event.key === 'Escape') { event.preventDefault(); dialog.close(); }
                });
            };
            dialog.addEventListener('click', event => {
                const rect = dialog.getBoundingClientRect();
                if (event.target === dialog && (event.clientX < rect.left || event.clientX > rect.right || event.clientY < rect.top || event.clientY > rect.bottom)) dialog.close();
            });
        })();
    </script>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script>
        const socket = typeof io === 'function' ? io() : null;
        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        function feedback() {
            if (navigator.vibrate) navigator.vibrate(30);
            if (audioCtx) {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.05);
            }
        }
        const v = feedback;
    </script>
</body>
</html>
